<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>文件管理</title>
  <style>
    body { margin:0; font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial; background:#f5f5f5; color:#222; }
    header { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #f0f0f0; }
    .header-inner { height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 12px; }
    .header-inner #planet { font-weight: 700; }
    .header-inner button { border: 1px solid #d9d9d9; background: #fff; border-radius: 10px; padding: 6px 10px; }
    main { padding: 10px; min-height: 60vh; }
    .divider { color: #999; font-size: 12px; text-align: center; margin: 12px 0; }
    .file-item { display: flex; align-items: center; gap: 10px; background:#fff; border-radius:12px; padding: 10px; margin: 6px 0; position: relative; }
    .file-item.image { align-items: flex-start; min-height: 140px; }
    .file-meta { display:flex; flex-direction:column; gap:4px; flex:1; }
    .btn { border: 1px solid #d9d9d9; background: #fff; border-radius: 10px; padding: 6px 10px; }
    .btn.secondary { background: #10aeff; border-color: #10aeff; color: #fff; }
    .note { font-size: 12px; color: #ff9aa0; }
    .note-edit { display:flex; align-items:center; gap:6px; margin-top:6px; }
    .note-edit input { flex:1; border:1px solid #e5e5e5; border-radius:8px; padding:6px 8px; }
    #imgViewer { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 20; }
    #imgViewPic { max-width: 96vw; max-height: 92vh; border-radius: 8px; }
    .btn-green { background:#f6ffed; border-color:#b7eb8f; color:#262626; }
    .btn-yellow { background:#fffbe6; border-color:#ffe58f; color:#262626; }
    .thumb { width: 120px; max-height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid #f0f0f0; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div id="planet">文件管理</div>
      <button id="btnBack">返回</button>
    </div>
  </header>
  <main id="list"></main>
  <div id="imgViewer"><img id="imgViewPic" alt=""></div>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/files.js"></script>
</body>
</html>
