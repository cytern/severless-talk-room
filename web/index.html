<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>HiHere</title>
  <link rel="manifest" id="manifestLink" href="manifest.webmanifest">
  <meta name="theme-color" content="#07c160">
  <link rel="icon" type="image/svg+xml" href="icons/paw.svg">
  <link rel="apple-touch-icon" href="icons/paw.svg">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #111; }
    header { position: sticky; top: 0; background: #fff; padding: 10px 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); z-index: 2; display: flex; align-items: center; justify-content: center; }
    .header-inner { display: flex; align-items: center; gap: 8px; width: 100%; }
    #planet { font-weight: 700; font-size: 18px; }
    #wsIndicator { flex: 1; display: flex; justify-content: center; align-items: center; gap: 6px; }
    #wsDot { width: 10px; height: 10px; border-radius: 50%; background: #bbb; box-shadow: 0 0 0 2px rgba(0,0,0,.05) inset; }
    #wsText { font-size: 12px; color: #666; }
    #btnRefresh { margin-left: auto; background: transparent; border: 0; color: #10aeff; font-size: 14px; padding: 6px 8px; align-self: center; }
    #list { padding: 12px; padding-bottom: calc(120px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; overflow-x: hidden; }
    .bubble { position: relative; max-width: 88vw; align-self: flex-start; background: #fff; border-radius: 16px; padding: 12px 40px 12px 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); display: flex; flex-direction: column; gap: 6px; box-sizing: border-box; }
    .bubble.self { align-self: flex-end; }
    .bubble.self.pending { background: #eeeeee; }
    .bubble.self.sent { background: #d9f7be; }
    .bubble.self.read { background: #e6f7ff; }
    .meta { font-size: 12px; color: #666; display: flex; gap: 8px; align-items: center; }
    .meta.space { justify-content: space-between; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; flex: 0 0 28px; }
    .nick { font-weight: 600; font-size: 14px; color: #333; }
    .msg { font-size: 18px; margin: 8px 0; line-height: 1.5; }
    .battery { width: 24px; height: 16px; vertical-align: middle; }
    .hidden { display: none; }
    .link { background: transparent; border: 0; color: #10aeff; padding: 0; font-size: 12px; }
    .actions { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 8px; padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); background: #fff; box-shadow: 0 -2px 10px rgba(0,0,0,.08); z-index: 3; }
    .btn { flex: 1; padding: 12px; font-size: 16px; border: 0; border-radius: 10px; background: #07c160; color: #fff; }
    .btn.secondary { background: #10aeff; }
    .btn.outline { background: #fff; color: #333; border: 1px solid #e5e5e5; }
    #compose { display: none; gap: 8px; align-items: center; width: 100%; }
    #text { flex: 1; border: 1px solid #e5e5e5; border-radius: 10px; padding: 10px 12px; font-size: 16px; }
    #sentinel { height: 1px; }
    #modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 20px; }
    #modalPunch { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 3; }
    .card { background: #fff; padding: 16px; border-radius: 12px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 10px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    input[type=text] { padding: 10px 12px; border: 1px solid #e5e5e5; border-radius: 8px; font-size: 16px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .chip { padding: 10px 12px; background: #f5f6f8; border: 1px solid #e8e8e8; border-radius: 10px; font-size: 14px; }
    .chip.active { background: #e6f7ff; border-color: #91d5ff; color: #111; }
    .row { display: flex; align-items: center; gap: 8px; }
    .countdown-row { display: flex; align-items: center; gap: 10px; }
    .countdown-bar { position: relative; flex: 1; height: 12px; background: #f0f0f0; border: 1px solid #e5e5e5; border-radius: 6px; overflow: hidden; }
    .countdown-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: #52c41a; transition: width .5s linear, background-color .5s linear; }
    .countdown-label { font-size: 11px; font-weight: 700; color: #fa541c; min-width: 88px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1, 'lnum' 1; }
    .divider { display: flex; align-items: center; justify-content: center; gap: 10px; color: #999; font-size: 12px; margin: 6px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e8e8e8; }
    /* timeline removed; using ws indicator */
    .dlspin { position: absolute; right: 10px; top: 10px; width: 16px; height: 16px; border: 2px solid rgba(16,174,255,.3); border-top-color: #10aeff; border-radius: 50%; animation: hspin .9s linear infinite; }
    @keyframes hspin { to { transform: rotate(360deg);} }
    #imgViewer { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 4; }
    #imgViewPic { max-width: 96vw; max-height: 92vh; border-radius: 8px; }
    .sendspin { position: absolute; left: -18px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; border: 2px solid rgba(7,193,96,.25); border-top-color: #07c160; border-radius: 50%; animation: hspin .9s linear infinite; }
    .sendfail { position: absolute; left: -18px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; border-radius: 50%; background: #ff4d4f; color: #fff; font-size: 12px; line-height: 16px; text-align: center; }
    .bubble { max-width: calc(100vw - 28px); }
    .bubble .msg { word-break: break-word; overflow-wrap: anywhere; }
    .bubble.self.failed { background: #fff1f0; }
    .reply-plus { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 50%; border: 1px solid #d9d9d9; background: #fff; color: #8c8c8c; font-weight: 700; line-height: 20px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.06); user-select: none; }
    .reply-quote { border-left: 3px solid #e8e8e8; background: #fafafa; padding: 6px 8px; border-radius: 8px; color: #666; font-size: 14px; margin-bottom: 4px; cursor: pointer; }
    .reply-quote .q-nick { font-weight: 600; margin-right: 6px; color: #595959; }
    .reply-editor { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .reply-editor input { flex: 1; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 10px; font-size: 14px; }
    .jump-highlight { box-shadow: 0 0 0 2px #69c0ff inset; animation: jblink .8s ease-in-out 2; }
    @keyframes jblink { 50% { box-shadow: 0 0 0 2px #ffd666 inset; } }
    #recModal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 5; }
    .rec-card { background: #fff; padding: 20px; border-radius: 12px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; align-items: center; }
    .rec-title { font-size: 18px; font-weight: 700; }
    .rec-timer { font-size: 28px; font-weight: 700; color: #07c160; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div id="planet" style="flex:0 0 auto;">HiHere</div>
      <div id="wsIndicator">
        <span id="wsDot"></span>
        <span id="wsText">同步数据中</span>
        <span id="geoCount"></span>
      </div>
      <button id="btnRefresh">刷新</button>
    </div>
  </header>
  <main id="list"><div id="sentinel"></div></main>
  <div class="actions">
    <script src="config.js"></script>
    <div id="composerRow" class="row" style="width:100%;">
      <input id="text" type="text" placeholder="说点什么…" style="flex:1;" enterkeyhint="send" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      <button id="btnSend" class="btn outline" style="flex:0 0 auto;">更多</button>
    </div>
    <input id="pickImage" type="file" accept="image/*" style="display:none;">
    <input id="pickCamera" type="file" accept="image/*" capture="environment" style="display:none;">
    <input id="pickFile" type="file" style="display:none;">
    <div id="moreSheet" style="display:none; position:fixed; left:0; right:0; bottom:0; background:#fff; box-shadow:0 -2px 10px rgba(0,0,0,.08); padding:12px; z-index:7; min-height:260px;">
      <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
        <button id="menuPunch" class="btn" style="background:#f6ffed; color:#262626; border:1px solid #b7eb8f;">🕒 打卡</button>
        <button id="menuVoice" class="btn" style="background:#e6f7ff; color:#262626; border:1px solid #bae7ff;">🎤 录音</button>
        <button id="menuImage" class="btn" style="background:#f6ffed; color:#262626; border:1px solid #b7eb8f;">🖼️ 图片</button>
        <button id="menuBack" class="btn" style="background:#f5222d; color:#fff; border:1px solid #ff4d4f;">🔙 返回</button>
        <button id="menuCamera" class="btn" style="background:#e6f7ff; color:#262626; border:1px solid #bae7ff;">📷 相机</button>
        <button id="menuFile" class="btn" style="background:#f6ffed; color:#262626; border:1px solid #b7eb8f;">📎 文件</button>
        <button id="menuFileMgr" class="btn" style="background:#fffbe6; color:#262626; border:1px solid #ffe58f;">📁 文件管理</button>
      </div>
    </div>
  </div>
  <div id="modal" style="display:none;">
    <div class="card">
      <div style="font-weight:700;">首次进入</div>
      <div class="field">
        <label>星球名（here_name，不可更改）</label>
        <input id="inpPlanet" type="text" placeholder="例如：my-planet">
      </div>
      <div class="field">
        <label>昵称（here_nick_name）</label>
        <input id="inpNick" type="text" placeholder="你的昵称">
      </div>
      <button id="btnSave" class="btn">确定</button>
    </div>
  </div>
  <div id="modalPunch" style="display:none;">
    <div class="card">
      <div id="pStep1">
        <div style="font-weight:700;">选择类型</div>
        <div class="grid">
          <button class="chip" data-type="学习">学习</button>
          <button class="chip" data-type="玩">玩</button>
          <button class="chip" data-type="吃饭">吃饭</button>
          <button class="chip" data-type="睡觉">睡觉</button>
          <button class="chip" data-type="自定义">自定义</button>
        </div>
        <div class="field" id="pTypeCustom" style="display:none;">
          <input id="inpTypeCustom" type="text" placeholder="输入自定义类型">
        </div>
        <div class="row">
          <button id="pNext1" class="btn" disabled>下一步</button>
          <button id="pCancel" class="btn outline" style="flex:0 0 auto;">取消</button>
        </div>
      </div>
      <div id="pStep2" style="display:none;">
        <div style="font-weight:700;">选择时长</div>
        <div class="grid">
          <button class="chip" data-mins="30">半小时</button>
          <button class="chip" data-mins="60">一小时</button>
          <button class="chip" data-mins="120">两小时</button>
          <button class="chip" data-mins="480">八小时</button>
          <button class="chip" data-mins="custom">自定义</button>
        </div>
        <div class="field" id="pTimeCustom" style="display:none;">
          <input id="inpTimeCustom" type="text" inputmode="numeric" placeholder="输入分钟数">
        </div>
        <div class="row">
          <button id="pPrev2" class="btn outline" style="flex:0 0 auto;">上一步</button>
          <button id="pNext2" class="btn" disabled>下一步</button>
        </div>
      </div>
      <div id="pStep3" style="display:none;">
        <div style="font-weight:700;">可选消息</div>
        <input id="inpMsgOptional" type="text" placeholder="可留空，直接确认即可">
        <div class="row">
          <button id="pPrev3" class="btn outline" style="flex:0 0 auto;">上一步</button>
          <button id="pSkip" class="btn secondary" style="flex:1;">跳过</button>
          <button id="pConfirm" class="btn" style="flex:1;">确认</button>
        </div>
      </div>
    </div>
  </div>
  <div id="recModal" style="display:none;">
    <div class="rec-card">
      <div class="rec-title">开始说话</div>
      <div id="recTimer" class="rec-timer">00:00</div>
      <button id="recDone" class="btn">录音完毕</button>
    </div>
  </div>
  <div id="imgViewer"><img id="imgViewPic" alt=""></div>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script>
    (function(){
      // Generate PNG icons locally from SVG using canvas, then override manifest with data URLs and adjust start_url/scope
      async function genIconsAndManifest(){
        try{
          const svgResp = await fetch('icons/paw.svg', { cache: 'no-store' });
          const svgTxt = await svgResp.text();
          const svgBlob = new Blob([svgTxt], { type: 'image/svg+xml' });
          const svgUrl = URL.createObjectURL(svgBlob);
          const img = new Image();
          await new Promise((res, rej)=>{ img.onload=res; img.onerror=rej; img.src=svgUrl; });
          const makePng = (size)=> {
            const c=document.createElement('canvas'); c.width=size; c.height=size;
            const ctx=c.getContext('2d'); ctx.clearRect(0,0,size,size);
            const scale=Math.min(size/img.width, size/img.height);
            const w=img.width*scale, h=img.height*scale;
            const x=(size-w)/2, y=(size-h)/2;
            ctx.drawImage(img, x, y, w, h);
            return c.toDataURL('image/png');
          };
          const png192 = makePng(192);
          const png512 = makePng(512);
          // Update favicon/apple-touch-icon links
          const head=document.getElementsByTagName('head')[0];
          const linkIcon=document.querySelector('link[rel="icon"]') || (function(){ const l=document.createElement('link'); l.rel='icon'; head.appendChild(l); return l; })();
          linkIcon.href = png192; linkIcon.type='image/png'; linkIcon.sizes='192x192';
          const linkApple=document.querySelector('link[rel="apple-touch-icon"]') || (function(){ const l=document.createElement('link'); l.rel='apple-touch-icon'; head.appendChild(l); return l; })();
          linkApple.href = png192; linkApple.sizes='180x180';
          // Load base manifest and override icons / paths
          const baseResp = await fetch('manifest.webmanifest', { cache: 'no-store' });
          const base = await baseResp.json();
          base.start_url = './';
          base.scope = './';
          base.icons = [
            { src: png192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
            { src: png512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' },
            { src: 'icons/paw.svg', sizes: 'any', type: 'image/svg+xml', purpose: 'any maskable' }
          ];
          const blob = new Blob([JSON.stringify(base)], { type: 'application/manifest+json' });
          const url = URL.createObjectURL(blob);
          const l = document.getElementById('manifestLink'); if (l) l.href = url;
        } catch {}
      }
      genIconsAndManifest();
      if ('serviceWorker' in navigator) {
        try { navigator.serviceWorker.register('./sw.js'); } catch {}
      }
    })();
  </script>
  <script src="js/vendor/NoSleep.min.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
